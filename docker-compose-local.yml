services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    container_name: stranger_web
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres_stranger
    restart: always
    environment:
      SPRING_PROFILE_ACTIVES: local
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./backend/sql/:/docker-entrypoint-initdb.d

