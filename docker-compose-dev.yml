version: '3.9'

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stranger_web
    environment:
      API_BACKEND_URL: http://api:8080/api
    ports:
      - "8084:80"
    volumes:
      - ./frontend:/var/www/html
    networks:
      - stranger-net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stranger_api
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    networks:
      - stranger-net

networks:
  stranger-net:
    driver: bridge